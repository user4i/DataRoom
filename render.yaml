services:
  - type: web
    name: gs1-data-room-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run db:generate && npm run db:deploy && npm run build:api
    startCommand: npm run start:prod -w api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: STORAGE_DRIVER
        value: s3
      - key: PORT
        value: 3001
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"

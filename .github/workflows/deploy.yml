name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Neon migrate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when DATABASE_URL is unset
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret not set; skipping Prisma migrate."

      - name: Checkout
        if: env.DATABASE_URL != ''
        uses: actions/checkout@v4

      # Prefer .nvmrc (26.7.0). Fall back to Node 22 LTS if 26.7.0 is unavailable.
      - name: Resolve Node.js version
        if: env.DATABASE_URL != ''
        id: node
        shell: bash
        run: |
          preferred="26.7.0"
          fallback="22"
          url="https://nodejs.org/dist/v${preferred}/node-v${preferred}-linux-x64.tar.xz"
          if curl -fsI "$url" >/dev/null; then
            echo "version=${preferred}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${fallback}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Prisma migrate deploy
        if: env.DATABASE_URL != ''
        run: npm run db:deploy

  deploy-web:
    name: Deploy web (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Set repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            echo "ORG_ID and PROJECT_ID must come from the Vercel project you created (Project → Settings → General)."
            exit 1
          fi

      # Never reuse a checked-in or leftover .vercel link. IDs come only from secrets.
      - name: Link from GitHub secrets
        working-directory: apps/web
        run: |
          rm -rf .vercel ../../.vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: apps/web
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        working-directory: apps/web
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-api:
    name: Deploy API (Render)
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

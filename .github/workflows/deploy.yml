name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Neon migrate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when DATABASE_URL is unset
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret not set; skipping Prisma migrate."

      - name: Checkout
        if: env.DATABASE_URL != ''
        uses: actions/checkout@v4

      # Prefer .nvmrc (26.7.0). Fall back to Node 22 LTS if 26.7.0 is unavailable.
      - name: Resolve Node.js version
        if: env.DATABASE_URL != ''
        id: node
        shell: bash
        run: |
          preferred="26.7.0"
          fallback="22"
          url="https://nodejs.org/dist/v${preferred}/node-v${preferred}-linux-x64.tar.xz"
          if curl -fsI "$url" >/dev/null; then
            echo "version=${preferred}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${fallback}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Prisma migrate deploy
        if: env.DATABASE_URL != ''
        run: npm run db:deploy

  deploy-web:
    name: Deploy web (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Set repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            echo "TOKEN must belong to the same Vercel account that owns the project."
            echo "ORG_ID is the Team ID of the project's team (Hobby: Your ID on the account tokens page)."
            echo "PROJECT_ID is Vercel → Project → Settings → General."
            exit 1
          fi

      # IDs come from env (secrets). Do not write .vercel/project.json — vercel pull
      # then fails with "Could not retrieve Project Settings".
      - name: Drop leftover .vercel link
        shell: bash
        run: rm -rf .vercel apps/web/.vercel

      # Next.js lives in apps/web. Without Root Directory the builder looks for
      # .next at the repo root (/vercel/path0/.next) and fails. CLI still uploads
      # from the git root so workspace packages and the lockfile are included.
      - name: Set Vercel Root Directory to apps/web
        shell: bash
        run: |
          payload='{"framework":"nextjs","rootDirectory":"apps/web","installCommand":"cd ../.. && npm ci","buildCommand":"npm run build"}'
          url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}"
          curl -fsS -X PATCH "$url" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd apps/web

  deploy-api:
    name: Deploy API (Render)
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
